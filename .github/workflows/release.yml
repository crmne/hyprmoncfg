name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

      - name: Goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  packaging:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: goreleaser
    uses: ./.github/workflows/packaging.yml
    with:
      version: ${{ github.ref_name }}

  publish-packaging-assets:
    needs: packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install packaging CLI
        run: gem install native-packages --version 0.5.1 --no-document
      - uses: actions/download-artifact@v4
        with:
          name: package-assets
          path: dist/package-assets
      - uses: actions/download-artifact@v4
        with:
          name: native-packages
          path: dist/native-packages
      - name: Attach binary packages and source recipes to the release
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          native-packages publish --from dist/native-packages --to github
          (cd dist/package-assets && sha256sum -c source-packaging-checksums.txt)
          gh release upload "$VERSION" dist/package-assets/*.tar.xz \
            dist/package-assets/source-packaging-checksums.txt --clobber

  publish-aur:
    if: vars.PUBLISH_AUR == 'true' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: publish-packaging-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install packaging CLI
        run: gem install native-packages --version 0.5.1 --no-document
      - uses: actions/download-artifact@v4
        with:
          name: packaging
          path: dist/packaging
      - name: Configure AUR SSH credentials
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          test -n "$AUR_SSH_KEY"
          test -n "$AUR_KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Publish generated AUR recipes
        env:
          GIT_AUTHOR_NAME: Carmine Paolino
          GIT_AUTHOR_EMAIL: carmine@paolino.me
          GIT_COMMITTER_NAME: Carmine Paolino
          GIT_COMMITTER_EMAIL: carmine@paolino.me
          GIT_SSH_COMMAND: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes
        run: native-packages publish-aur dist/packaging

  sync-docs-version:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    needs: goreleaser
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update docs version selector
        run: |
          version="${RELEASE_VERSION#v}"
          sed -i "s/^current:.*/current: \"${version}\"/" docs/_data/versions.yml

      - name: Commit docs version update
        run: |
          version="${RELEASE_VERSION#v}"
          if git diff --quiet -- docs/_data/versions.yml; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_data/versions.yml
          git commit -m "docs: update version selector to ${version}"
          git push origin HEAD:main

      - name: Trigger docs workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml --ref main
