name: Packaging

on:
  push:
    branches: [main]
    paths: [native-packages.yaml, packaging/**, scripts/package*, .goreleaser.yml, .github/workflows/packaging.yml, .github/workflows/release.yml, go.mod, go.sum]
  pull_request:
    paths: [native-packages.yaml, packaging/**, scripts/package*, .goreleaser.yml, .github/workflows/packaging.yml, .github/workflows/release.yml, go.mod, go.sum]
  workflow_dispatch:
    inputs:
      version:
        description: Published version to package (empty uses the latest local tag)
        type: string
        default: ''
      publish:
        description: Attach packages and push the AUR recipes (needs a version)
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      publish:
        type: boolean
        default: true
    secrets:
      AUR_SSH_KEY:
        required: false
      AUR_KNOWN_HOSTS:
        required: false

permissions:
  contents: read

jobs:
  release-packages:
    if: inputs.version != ''
    permissions:
      contents: write
    uses: crmne/native-packages/.github/workflows/package.yml@8025372579b1864b09b579255484f4e15f65bc78 # main after v0.7.0
    with:
      version: ${{ inputs.version }}
      # Attaches DEB/RPM packages and AUR recipes to the release, then pushes
      # the AUR recipes when the repository variable PUBLISH_AUR is true.
      publish: ${{ inputs.publish == true }}
    secrets: inherit

  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install packaging CLI and source-recipe test dependency
        run: |
          gem install native-packages --version 0.7.0 --no-document
          gem install minitest --version 6.0.6 --no-document
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nix-bin libarchive-tools
      - name: Test packaging automation
        run: |
          ruby scripts/packages_test.rb --verbose
          native-packages validate
          native-packages repositories
      - name: Generate and validate all recipes
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Source-package recipes are stable-channel artifacts. A prerelease
          # tag may be newer than the latest stable tag, but must not become
          # the implicit input for main/PR validation.
          latest_stable="$(git tag --merged HEAD --list 'v[0-9]*' --sort=-version:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -n 1)"
          version="${INPUT_VERSION:-$latest_stable}"
          test -n "$version"
          ruby scripts/package_sources.rb prepare "$version" --output dist/packaging
          ruby scripts/package_sources.rb artifacts dist/packaging
      - uses: actions/upload-artifact@v4
        with:
          name: packaging
          path: dist/packaging/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: package-assets
          path: dist/package-assets/
          if-no-files-found: error

  binary-packages:
    if: inputs.version == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install shared packaging tools
        run: |
          gem install native-packages --version 0.7.0 --no-document
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          sudo apt-get update
          sudo apt-get install -y libarchive-tools binutils rpm
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.18.1
          args: release --snapshot --clean --skip=publish
      - name: Package snapshot archives and AUR recipes with the shared CLI
        run: |
          # Snapshot archive names carry a prerelease suffix. Use a disposable
          # stable package version for this installation-content check.
          for arch in amd64 arm64; do
            cp dist/hyprmoncfg_*_linux_$arch.tar.gz "dist/hyprmoncfg_0.0.0_linux_$arch.tar.gz"
          done
          cp .release-assets/hyprmoncfg-*-deps.tar.xz dist/hyprmoncfg-0.0.0-deps.tar.xz
          git archive --format=tar.gz --prefix=hyprmoncfg-0.0.0/ --output dist/hyprmoncfg-0.0.0.tar.gz HEAD
          native-packages build --version 0.0.0 --output dist/snapshot-packages
      - name: Inspect Debian and RPM contents
        run: |
          for package in dist/snapshot-packages/packages/*/deb/*.deb; do
            dpkg-deb --contents "$package"
            dpkg-deb --extract "$package" /tmp/deb-package
            test -f /tmp/deb-package/usr/bin/hyprmoncfg
            test -f /tmp/deb-package/usr/bin/hyprmoncfgd
            test -f /tmp/deb-package/usr/lib/systemd/user/hyprmoncfgd.service
            rm -r /tmp/deb-package
          done
          for package in dist/snapshot-packages/packages/*/rpm/*.rpm; do
            rpm -qpl "$package"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: binary-packages
          path: dist/snapshot-packages/
