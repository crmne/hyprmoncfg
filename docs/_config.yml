title: hyprmoncfg
description: Create multi-monitor layouts for Hyprland and switch them automatically on hotplug and lid events.
lang: en-US
timezone: Europe/Berlin
url: https://hyprmoncfg.dev
baseurl: ""
logo: /assets/images/logo.svg
image: /assets/images/screenshots/layout-dark.png

markdown: kramdown
kramdown:
  input: GFM

permalink: pretty
theme: jekyll-vitepress-theme

collections:
  guide:
    output: true
    permalink: "/:name/"
  reference:
    output: true
    permalink: "/:name/"

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/screenshots/layout-dark.png
      topics:
        - Hyprland
        - monitor configuration
        - Linux desktop automation
        - Wayland
  - scope:
      type: guide
    values:
      layout: default
  - scope:
      type: reference
    values:
      layout: default

jekyll_vitepress:
  seo:
    page_type: TechArticle
    image:
      path: /assets/images/screenshots/layout-dark.png
      alt: hyprmoncfg visual monitor layout editor
    publisher:
      type: Organization
      name: hyprmoncfg
      url: https://hyprmoncfg.dev
      logo: /assets/images/logo.svg
      same_as:
        - https://github.com/crmne/hyprmoncfg
        - https://aur.archlinux.org/packages/hyprmoncfg
        - https://aur.archlinux.org/packages/hyprmoncfg-git
        - https://terminaltrove.com/hyprmoncfg/
  llms:
    title: hyprmoncfg
    description: >-
      Documentation for hyprmoncfg, a visual multi-monitor layout editor and
      automatic profile switcher for Hyprland.
    full: true
    details: >-
      Start with the overview and getting-started guides, then use the TUI,
      daemon, dotfiles, commands, and configuration-file references. The
      authoritative source is [crmne/hyprmoncfg](https://github.com/crmne/hyprmoncfg).
  branding:
    site_title: hyprmoncfg
    logo:
      default: /assets/images/logo.svg
      alt: hyprmoncfg
  syntax:
    light_theme: github
    dark_theme: github.dark
  footer:
    enabled: true
    show_on_docs: false
    message: >-
      Brought to you by <a href="https://paolino.me" target="_blank" rel="noreferrer">Carmine Paolino</a>, maker of
    copyright: >-
      <span class="footer-brand-links"><a href="https://chatwithwork.com" class="footer-chatwithwork-link" target="_blank" rel="noreferrer"><img class="footer-chatwithwork-logo theme-image light" src="https://chatwithwork.com/logotype.svg" alt="Chat with Work"><img class="footer-chatwithwork-logo theme-image dark" src="https://chatwithwork.com/logotype-dark.svg" alt="Chat with Work"></a><a href="https://rubyllm.com" class="footer-rubyllm-link" target="_blank" rel="noreferrer"><img class="footer-rubyllm-logo theme-image light" src="https://rubyllm.com/assets/images/logotype.svg" alt="RubyLLM"><img class="footer-rubyllm-logo theme-image dark" src="https://rubyllm.com/assets/images/logotype_dark.svg" alt="RubyLLM"></a><a href="https://paolino.me/projects" target="_blank" rel="noreferrer" aria-label="More projects by Carmine Paolino">and more</a></span><br><span class="footer-built-with">Docs built with <a href="https://jekyll-vitepress.dev" target="_blank" rel="noreferrer">Jekyll VitePress</a>.</span>
  doc_footer:
    enabled: true
    previous_label: Previous page
    next_label: Next page
  last_updated:
    enabled: true
    text: Last updated
    format: "%Y-%m-%d %H:%M"
  edit_link:
    enabled: true
    pattern: "https://github.com/crmne/hyprmoncfg/edit/main/docs/:path"
    text: Edit this page on GitHub
  github_star:
    enabled: true
    repository: crmne/hyprmoncfg
    text: Star
    show_count: true
  github_sponsor:
    enabled: true
    user: crmne
    text: Sponsor

plugins:
  - jekyll-vitepress-theme
  - jekyll-redirect-from

exclude:
  - _site
  - .jekyll-cache
  - .sass-cache
  - .bundle
  - vendor
  - Gemfile
  - Gemfile.lock
